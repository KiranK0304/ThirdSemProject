[project]
name = "talentwright"
version = "0.1.0"
description = "Job application website with AI assistance"
readme = "README.md"
license = { text = "MIT" }
authors = [
  { name = "Kiran, Blesson, Tinu, Christopher, Pooja", email = "kiran,-blesson,-tinu,-christopher,-pooja@talentwright.ai" },
]
requires-python = "==3.14.*"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "argon2-cffi==25.1.0",
  "collectfasta==3.3.3",
  "django==6.0.7",
  "django-anymail==15.1",
  "django-cors-headers==4.9.0",
  "django-environ==0.14.0",
  "django-model-utils==5.0.0",
  "django-redis==7.0.0",
  "django-storages[s3]==1.14.6",
  "djangorestframework==3.17.1",
  "djangorestframework-simplejwt>=5.3.0",
  "drf-spectacular==0.30.0",
  "gunicorn==26.0.0",
  "hiredis==3.4.0",
  "openai>=1.40.0",
  "pillow==12.3.0",
  "psycopg[binary]==3.3.4",
  "pydantic>=2.0.0",
  "pymupdf>=1.25.0",
  "python-slugify==8.0.4",
  "redis==8.1.0",
  "watchdog>=6.0.0",
]

[dependency-groups]
dev = [
  "coverage==7.15.3",
  "django-coverage-plugin==3.2.2",
  "django-debug-toolbar==7.0.0",
  "django-extensions==4.1",
  "django-stubs[compatible-mypy]==6.0.7",
  "django-upgrade==1.31.1",
  "djangorestframework-stubs==3.17.1",
  "djlint==1.43.2",
  "factory-boy==3.3.3",
  "ipdb==0.13.13",
  "mypy==2.3.0",
  "pre-commit==4.6.1",
  "psycopg[binary]==3.3.4",
  "pytest==9.1.1",
  "pytest-django==4.12.0",
  "pytest-sugar==1.1.1",
  "ruff==0.16.1",
  "sphinx==9.1.0",
  "sphinx-autobuild==2025.8.25",
  "werkzeug[watchdog]==3.1.8",
]

# ==== djLint ====
[tool.djlint]
profile = "django"
include = "H017,H035"
indent = 2
max_line_length = 119
blank_line_after_tag = "load,extends"
close_void_tags = true
format_css = true
format_js = true
custom_blocks = "slot"
# TODO: remove T002 when fixed https://github.com/djlint/djLint/issues/687
ignore = "H006,H030,H031,T002"
css.indent_size = 2
js.indent_size = 2

# ==== ruff ====
[tool.ruff]
line-length = 119
# Exclude a variety of commonly ignored directories.
extend-exclude = [
  "*/migrations/*.py",
  "staticfiles/*",
]
lint.select = [
  "B",  # flake8-bugbear
  "C4", # flake8-comprehensions
  "DJ", # flake8-django
  "E",  # pycodestyle errors
  "F",  # pyflakes
  "I",  # isort
  "UP", # pyupgrade
  "W",  # pycodestyle warnings
]
lint.ignore = [
  "DJ012",  # Order of model's inner classes
  "E501",   # Line length handled by formatter
  "RUF012", # Mutable class attributes should be annotated with `typing.ClassVar`
]
lint.per-file-ignores."**/tests/*" = [ "ARG001", "PLR2004", "S101" ]
lint.per-file-ignores."tests/*" = [ "ARG001", "PLR2004", "S101" ]
lint.isort.force-single-line = false

# ==== pyproject-fmt ====
[tool.pyproject-fmt]
keep_full_version = true

# ==== mypy ====
[tool.mypy]
ignore_missing_imports = true
python_version = "3.14"
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
plugins = [
  "mypy_django_plugin.main",
  "mypy_drf_plugin.main",
]
warn_unused_configs = true
overrides = [
  # Django migrations should not produce any errors:
  { module = "*.migrations.*", ignore_errors = true },
]

[tool.django-stubs]
django_settings_module = "config.settings.test"

# ==== pytest ====
[tool.pytest]
addopts = [
  "--ds=config.settings.test",
  "--reuse-db",
  "--import-mode=importlib",
]
minversion = "9.0"
python_files = [
  "tests.py",
  "test_*.py",
]

[tool.coverage]
# ==== Coverage ====
run.include = [ "talentwright/**" ]
run.omit = [ "*/migrations/*", "*/tests/*" ]
run.plugins = [ "django_coverage_plugin" ]
