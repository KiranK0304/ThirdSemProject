name: Backend CI

on:
  pull_request:
    branches: ['main']
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - '.gitignore'

  push:
    branches: ['main']
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - '.gitignore'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  lint:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev

      - name: Check Code Formatting (Ruff)
        run: uv run ruff format --check

      - name: Run Linter (Ruff)
        run: uv run ruff check

  test:
    name: Migrations & Pytest Suite
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: talentwright
          POSTGRES_USER: talentwright
          POSTGRES_PASSWORD: password123
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://talentwright:password123@localhost:5432/talentwright
      DJANGO_SECRET_KEY: ci-secret-key-for-testing-only-12345
      DJANGO_SETTINGS_MODULE: config.settings.test
      SCREENING_LLM_API_KEY: ci-test-key

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev

      - name: Check for Uncreated Database Migrations
        run: uv run python manage.py makemigrations --check --dry-run

      - name: Run Database Migrations
        run: uv run python manage.py migrate

      - name: Run Test Suite (Pytest)
        run: uv run pytest

  docker-build:
    name: Verify Production Docker Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Production Image (Dry run)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./compose/production/django/Dockerfile
          push: false
          tags: talentwright-backend:test

