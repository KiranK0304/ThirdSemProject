volumes:
  talentwright_local_postgres_data: {}
  talentwright_local_postgres_data_backups: {}
  

services:
  django:
    build:
      context: .
      dockerfile: ./compose/local/django/Dockerfile
    image: talentwright_local_django
    container_name: talentwright_local_django
    depends_on:
      - postgres
      - mailpit
    volumes:
      - /app/.venv
      - .:/app:z
    env_file:
      - ./.envs/.local/.django
      - ./.envs/.local/.postgres
    ports:
      - '8000:8000'
    command: /start

  postgres:
    build:
      context: .
      dockerfile: ./compose/production/postgres/Dockerfile
    image: talentwright_production_postgres
    container_name: talentwright_local_postgres
    volumes:
      - talentwright_local_postgres_data:/var/lib/postgresql/18/docker
      - talentwright_local_postgres_data_backups:/backups
    env_file:
      - ./.envs/.local/.postgres

  mailpit:
    image: docker.io/axllent/mailpit:latest
    container_name: talentwright_local_mailpit
    ports:
      - "8025:8025"

  frontend:
    build:
      context: ../talentwright_frontend
      dockerfile: Dockerfile
      target: dev
    image: talentwright_frontend:latest
    container_name: talentwright_frontend
    depends_on:
      - django
    volumes:
      - ../talentwright_frontend:/app
      - /app/node_modules
    environment:
      - VITE_BACKEND_URL=http://django:8000
    ports:
      - "5173:5173"
