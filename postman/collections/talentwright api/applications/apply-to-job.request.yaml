$kind: http-request
method: POST
url: '{{base_url}}/jobs/{{job_id}}/apply/'
order: 1000
headers:
  - key: Content-Type
    value: application/json
  - key: Authorization
    value: 'Bearer {{access_token}}'
body:
  type: json
  content: |-
    {
      "cover_letter": "I am excited to apply for this role."
    }
